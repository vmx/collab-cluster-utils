# Keep everything from Africa, forever; hold nothing else.
#
# The box reaches from Cape Verde to Rodrigues, and from the Mediterranean
# south to 60° S, taking in the ocean down to Antarctica, Bouvet included.
# Together with the other continent examples it covers the whole globe, so
# with each of them on some node, every dataset is held somewhere. A
# dataset matches if its footprint intersects the box at all, so this also
# keeps parts of southern Europe, the Middle East and Arabia. See
# data-manager-policy.example.toml for how rules work.

[[rule]]
bbox_intersects = [-26.0, -60.0, 64.0, 38.0]   # west, south, east, north
