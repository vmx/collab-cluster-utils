# Keep everything from Europe, forever; hold nothing else.
#
# The box reaches from the Azores to the Urals, and from the Mediterranean
# to the North Pole. Together with the other continent examples it covers
# the whole globe, so with each of them on some node, every dataset is
# held somewhere. A dataset matches if its footprint intersects the box at
# all, so this also keeps some of North Africa, Turkey, the Middle East and
# Greenland's east coast. See data-manager-policy.example.toml for how
# rules work.

[[rule]]
bbox_intersects = [-31.5, 34.0, 60.0, 90.0]   # west, south, east, north
