# Keep everything from Europe, forever; hold nothing else.
#
# The box is a rough outline of Europe, from Iceland and the Azores in the
# west to the Urals in the east. A dataset matches if its footprint
# intersects the box at all, so this also keeps some of North Africa, Turkey
# and the Middle East. See data-manager-policy.example.toml for how rules
# work.

[[rule]]
bbox_intersects = [-31.5, 34.0, 60.0, 72.0]   # west, south, east, north
