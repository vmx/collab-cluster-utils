[project]
name = "collab-cluster-utils"
version = "0.1.0"
description = "Independent utilities supporting the collab-cluster project"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    # Only for the end-to-end web seed test; no wheels beyond cp313 yet.
    "libtorrent>=2.1; python_version < '3.14'",
]

[project.scripts]
collab-cluster-publisher = "collab_cluster_utils.publisher.cli:main"
collab-cluster-data-manager = "collab_cluster_utils.data_manager.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/collab_cluster_utils"]
