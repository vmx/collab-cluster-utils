[project]
name = "collab-cluster-utils"
version = "0.1.0"
description = "Independent utilities supporting the collab-cluster project"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
# Upper-bounded because libtorrent only ships wheels up to cp313 (no sdist to build from).
requires-python = ">=3.11,<3.14"
dependencies = [
    "libtorrent>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[project.scripts]
collab-cluster-publisher = "collab_cluster_utils.publisher.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/collab_cluster_utils"]
